
name: TaskMesh CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: job-service/package-lock.json

      - name: Install job-service dependencies
        run: npm ci --prefix job-service

      - name: Run API tests
        run: npm test --prefix job-service
